name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: meetingrooms
  API_PROJECT: src/backend/MeetingRooms.Api/MeetingRooms.Api.csproj
  UNIT_TESTS: tests/MeetingRooms.UnitTests/MeetingRooms.UnitTests.csproj
  FRONTEND_DIR: src/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      # Ahead of the frontend build so a red test fails the run before npm install spends
      # a minute. This gates the deploy, not the merge - the workflow only triggers on
      # main, by which point the merge has happened - so it is a backstop, not a substitute
      # for running the suite locally before merging.
      #
      # The build covers the whole solution, so a compile break anywhere - the concurrency
      # test project included - fails here rather than later at publish. The test run covers
      # the unit project only, because tests/MeetingRooms.ConcurrencyTests drives the real
      # application against a real SQL Server and this runner has none. That test is run
      # locally and by the reviewer, with the two commands in README.md; assignment #6 asks
      # for a test in the repository that the reviewer can run, which it is. Putting a
      # database container and a timing-sensitive test on the deploy path would buy a green
      # tick at the cost of a deploy that a slow container can block.
      - name: Build and unit-test
        run: |
          dotnet build --configuration Release
          dotnet test ${{ env.UNIT_TESTS }} --configuration Release --no-build

      # Must run before the publish below: Vite writes into the API project's wwwroot,
      # and MSBuild globs that directory when the publish runs. Reversing these two steps
      # produces a deploy with no frontend and no error.
      #
      # `npm ci` installs the committed lockfile exactly - it neither re-resolves versions
      # nor honours a release-age cooldown, so the tree deployed is the tree reviewed.
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --ignore-scripts && npm run build

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o ./publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
